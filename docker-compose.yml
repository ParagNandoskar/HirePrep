services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5000
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NLP_SERVICE_URL: http://nlp-service:8000
      RESUME_SERVICE_URL: http://nlp-service:8000
      AUDIO_SERVICE_URL: http://audio-service:8001
      PYTHON_NLP_SERVICE_URL: http://nlp-service:8000
      PYTHON_AUDIO_SERVICE_URL: http://audio-service:8001
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - nlp-service
      - audio-service
    restart: always
    networks:
      - hireprep-network

  nlp-service:
    build:
      context: ./backend/nlp-service
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/nlp-service/.env
        required: false
    environment:
      PORT: 8000
      FLASK_ENV: production
    restart: always
    networks:
      - hireprep-network

  audio-service:
    build:
      context: ./backend/audio-service
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/audio-service/.env
        required: false
    environment:
      AUDIO_SERVICE_PORT: 8001
    restart: always
    networks:
      - hireprep-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    networks:
      - hireprep-network

networks:
  hireprep-network:
    driver: bridge