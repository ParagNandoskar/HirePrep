version: '3.8'

services:
  # Local MongoDB for development
  mongodb-local:
    image: mongo:7.0
    container_name: hireprep-mongodb-local
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: hireprep-local
    volumes:
      - mongodb_data:/data/db
      - ./mongodb-init:/docker-entrypoint-initdb.d
    networks:
      - hireprep-network

  # Redis for session storage (optional)
  redis-local:
    image: redis:7.2-alpine
    container_name: hireprep-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hireprep-network

  # Backend service
  backend:
    build: .
    container_name: hireprep-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password123@mongodb-local:27017/hireprep-local?authSource=admin
    depends_on:
      - mongodb-local
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - hireprep-network

  # Python Video Analysis Service
  python-video:
    build:
      context: ./python-services
      dockerfile: Dockerfile.video
    container_name: hireprep-video-analysis
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - hireprep-network

  # Python Audio Analysis Service  
  python-audio:
    build:
      context: ./python-services
      dockerfile: Dockerfile.audio
    container_name: hireprep-audio-analysis
    restart: unless-stopped
    ports:
      - "8002:8002"
    networks:
      - hireprep-network

volumes:
  mongodb_data:
  redis_data:

networks:
  hireprep-network:
    driver: bridge
