version: '3.8'

services:
  video-analysis:
    build:
      context: .
      dockerfile: Dockerfile.video
    container_name: hireprep-video-analysis
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - FLASK_ENV=production
      - GUNICORN_WORKERS=2
      - GUNICORN_THREADS=4
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - hireprep-network

  audio-analysis:
    build:
      context: .
      dockerfile: Dockerfile.audio
    container_name: hireprep-audio-analysis
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - hireprep-network

networks:
  hireprep-network:
    driver: bridge

# Usage:
# Development: docker-compose up
# Production: docker-compose up -d
# Scale video service: docker-compose up -d --scale video-analysis=3
# View logs: docker-compose logs -f video-analysis
# Stop all: docker-compose down
